<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>病区概览</title>
  <link rel="stylesheet" href="patient-card.css?v=5">
  <link rel="stylesheet" href="overview-theme.css?v=5">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <h1 id="deptTitle">病区概览</h1>
      <span class="pill" id="shiftPill" hidden></span>
      <span class="as-of" id="asOf"></span>
      <div class="actions">
        <button class="btn" type="button" id="btnStats">统计</button>
        <button class="btn" type="button" id="btnHandover" title="交班模式：停止自动滚动，固定床位顺序便于讲解">交班模式</button>
        <button class="btn" type="button" id="btnAiHandover">AI交班</button>
        <button class="btn" type="button" id="btnGroupSettings" title="配置当前科室的医疗组显示名称">组别配置</button>
        <button class="btn" type="button" id="btnTheme" title="配置卡片颜色标识（实时预览，所有大屏统一）">配色</button>
        <button class="btn primary" type="button" id="btnRefresh">刷新</button>
      </div>
    </header>

    <section class="kpi" id="kpiStrip" aria-label="核心统计">
      <div class="kpi-item" role="button" tabindex="0" data-open="1"><span class="lab">在科</span><span class="val" id="kpiInDept">—</span></div>
      <div class="kpi-item" role="button" tabindex="0" data-filter="empty"><span class="lab">空床</span><span class="val" id="kpiEmpty">—</span></div>
      <div class="kpi-item" role="button" tabindex="0" data-filter="vent"><span class="lab">呼吸机</span><span class="val" id="kpiVent">—</span></div>
      <div class="kpi-item" role="button" tabindex="0" data-filter="fall"><span class="lab">跌倒高</span><span class="val" id="kpiFall">—</span></div>
      <div class="kpi-item" role="button" tabindex="0" data-filter="pressure"><span class="lab">压疮高</span><span class="val" id="kpiPressure">—</span></div>
      <div class="kpi-item" role="button" tabindex="0" data-filter="new"><span class="lab">新收</span><span class="val" id="kpiNew">—</span></div>
      <div class="kpi-tools">
        <span class="tool-label">医疗组</span>
        <div id="groupFilter" class="group-filter" role="group" aria-label="医疗组筛选">
          <button class="chip-btn active" type="button" data-g="">全部</button>
        </div>
        <span class="tool-sep"></span>
        <button class="chip-btn active" type="button" data-f="all">全部</button>
        <button class="chip-btn" type="button" data-f="new">新入科</button>
        <button class="chip-btn" type="button" data-f="long">长程</button>
        <button class="chip-btn" type="button" data-f="empty">仅空床</button>
      </div>
    </section>

    <div class="main">
      <div class="content">
        <div id="state" class="state-panel">
          <h1>等待科室数据</h1>
          <p>正在获取当前科室的在科患者…</p>
        </div>
        <div id="cardGrid" class="grid" hidden></div>
      </div>
      <aside class="drawer" id="drawer">
        <div class="drawer-head">统计与交班重点<button class="close" type="button" id="btnClose" aria-label="收起">×</button></div>
        <div class="drawer-body" id="drawerBody"></div>
      </aside>
    </div>

    <div class="hint">
      <span>强预警才有色块 · 医疗组可顶部筛选 · 诊断严格 2 行</span>
      <span class="right">本屏用于交班辅助，非床旁实时监护</span>
    </div>
  </div>
  <dialog id="aiHandoverDialog" class="ai-dialog" aria-labelledby="aiTitle">
    <div class="ai-head"><div><h2 id="aiTitle">AI交班草稿</h2><p>病程、体征和相关历史 · 请逐条核对</p></div><button id="aiClose" class="ai-close" type="button" aria-label="关闭">×</button></div>
    <div class="ai-body">
      <p class="ai-notice">仅供交班参考，不替代医护判断或正式病历。请核实患者、来源和时间，缺失不等于正常。</p>
      <div class="ai-controls"><label for="aiPatient">患者</label><select id="aiPatient"></select><button id="aiLoad" type="button">读取资料</button><button id="aiGenerate" type="button" class="ai-primary">生成交班草稿</button></div>
      <p id="aiStatus" class="ai-status" role="status"></p><div id="aiWarnings" class="ai-warnings"></div>
      <div class="ai-layout"><section><h3>交班草稿</h3><p class="ai-tip">可修改；核对状态仅保留在当前页面，关闭后清除，不记录核对人。</p><textarea id="aiDraft" rows="16" placeholder="生成后在此核对、修改" aria-label="交班草稿"></textarea><button id="aiConfirm" type="button" disabled>标记已核对</button><span id="aiConfirmed" role="status"></span></section>
      <section><h3>资料时间线</h3><p id="aiTimelineTip" class="ai-tip">按时间查看资料，生成后请结合原系统逐条核对。</p><div id="aiSources" class="ai-timeline"></div></section></div>
    </div>
  </dialog>
  <link rel="stylesheet" href="handover.css?v=2">
  <link rel="stylesheet" href="group-settings.css?v=1">
  <script src="patient-card.js?v=6"></script>
  <script src="group-settings.js?v=1"></script>
  <script src="handover.js?v=2"></script>
  <script src="overview-theme.js?v=5"></script>
</body>
</html>
